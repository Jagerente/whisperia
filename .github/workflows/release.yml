name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Tag matches Cargo.toml
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'whisperia' }).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version in Cargo.toml" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Pack the server
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $archive = Join-Path $PWD "dist/whisperia-server-$env:VERSION-windows-x64.zip"
          Compress-Archive -Path "dist/whisperia-server/*" -DestinationPath $archive -CompressionLevel Optimal -Force

      - name: Build the client installer
        shell: pwsh
        run: ./scripts/installer.ps1 -Output dist

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $assets = @(
            "dist/whisperia-client-$env:VERSION-windows-x64-setup.exe",
            "dist/whisperia-server-$env:VERSION-windows-x64.zip"
          )
          $missing = @($assets | Where-Object { -not (Test-Path $_) })
          if ($missing) { throw "missing: $($missing -join ', ')" }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "Whisperia $env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
