[workspace]
resolver = "2"
members = ["crates/proto", "crates/server", "crates/client", "crates/winmedia", "crates/e2e"]
# `cargo build` leaves out the tests: e2e turns on the client's `testing` feature, which must not reach the release exe.
default-members = ["crates/proto", "crates/server", "crates/client", "crates/winmedia"]
[workspace.package]
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/jagerente/whisperia"
rust-version = "1.85"

[workspace.dependencies]
whisperia-proto = { path = "crates/proto" }
whisperia-winmedia = { path = "crates/winmedia" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
mdns-sd = "0.21"
sha2 = "0.10"

[workspace.lints.rust]
# `deny`, not `forbid`: the small FFI modules in `client/src/desktop` allow it for themselves.
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Audio DSP in a debug build cannot keep up with realtime; optimise dependencies always.
[profile.dev.package."*"]
opt-level = 3
