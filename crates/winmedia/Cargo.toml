[package]
name = "whisperia-winmedia"
description = "Windows media FFI for whisperia: screen capture, hardware H.264, pictures shared with the window"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `selftest`: the whole picture path on the real video card, for the hardware tests.
testing = []

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# The window reads the shared textures through wgpu: the version is the one its renderer uses.
wgpu = { version = "30", default-features = false, features = ["dx12"] }
# `#[implement]` expands to paths in `windows_core`.
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

# The one crate of the workspace that is FFI from top to bottom: every call into Direct3D, Media
# Foundation and Win32 is `unsafe`. Nothing unsafe leaves it.
[lints.rust]
unsafe_code = "allow"
