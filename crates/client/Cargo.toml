[package]
name = "whisperia"
description = "whisperia voice client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
whisperia-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
quinn.workspace = true
rustls.workspace = true
serde.workspace = true
clap.workspace = true
directories.workspace = true
mdns-sd.workspace = true
sha2.workspace = true
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls", "gzip"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
cpal = "0.18"
rtrb = "0.4"
rubato = "5"
opus = "0.4"
nnnoiseless = { version = "0.5", default-features = false }
ndarray = "0.15"
audioadapter-buffers = "5"

# DeepFilterNet3 is not on crates.io (the published crate predates it). The revision is pinned, and
# so is tract: deep_filter does not compile against later 0.21.x releases.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model-ll"] }
tract-core = "=0.21.4"
tract-data = "=0.21.4"
tract-hir = "=0.21.4"
tract-linalg = "=0.21.4"
tract-nnef = "=0.21.4"
tract-onnx = "=0.21.4"
tract-onnx-opl = "=0.21.4"
tract-pulse = "=0.21.4"
tract-pulse-opl = "=0.21.4"

# The window. Skia on wgpu is the renderer that was measured to be cheap enough (FemtoVG costs six
# times the CPU per frame) and the one that takes the decoder's textures without a copy; wgpu's
# version is Slint's. The software renderer is what is left on a PC where Direct3D 12 does not
# start. The testing backend is what `gui::Harness` drives the window with, without a screen; it
# follows Slint's version exactly and comes only with the `testing` feature, like the harness.
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia", "renderer-software", "software-renderer-systemfonts", "software-renderer-path", "unstable-wgpu-30", "unstable-winit-030", "accessibility", "image-default-formats"] }
i-slint-backend-testing = { version = "=1.18.0", features = ["renderer-skia"], optional = true }
pollster = "0.4"
png = { version = "0.17", optional = true }

[features]
testing = ["dep:i-slint-backend-testing", "dep:png"]

[target.'cfg(windows)'.dependencies]
whisperia-winmedia.workspace = true
arboard = { version = "3.6", default-features = false }
wasapi = "0.24"
global-hotkey = "0.8"
tray-icon = { version = "0.25", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
